<!doctype html>

<html lang="ru">
<head>
  <meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0, viewport-fit=cover"

>

  <meta name="theme-color" content="#071426">

  <title>molecule adjutant</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="style.css">

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

</head>

<body>

  <main class="app">

<section class="screen home-screen" id="homeScreen">

  <div class="home-glow glow-one"></div>
  <div class="home-glow glow-two"></div>

  <div class="home-content">

    <div class="home-topbar">

      <div class="brand">
        <span class="brand-star" style="font-size: 55px;">⚛︎</span>
        <span style="font-size: 25px;">molecule adjutant</span>
        <p class="sections-title"><i>by arttmolecule</i></p>
      </div>

      <button
        class="theme-toggle"
        id="themeToggle"
        type="button"
        aria-label="Переключить тему"
      >
        <span class="theme-toggle-icon" id="themeToggleIcon">☾</span>
      </button>

    </div>

    <div class="quote-card">

      <h4 class="support-subtitle">
        напоминание на день
      </h4>

      <p class="quote-text" id="quote">
        мы не обязаны заслуживать право на еду, отдых и заботу о себе
      </p>

      <button
        class="quote-button"
        id="newQuote"
        type="button"
      >
        другая фраза
      </button>

    </div>

    <button
      class="diary-quick-card"
      id="quickDiaryButton"
      type="button"
    >
      <span class="diary-quick-icon">✎</span>

      <span class="diary-quick-content">
        <strong>добавить запись в дневник</strong>
        <small>быстрая запись о том, как ты себя чувствуешь</small>
      </span>

      <span class="diary-quick-arrow">›</span>
    </button>

  </div>

  <div class="sections-area">

    <div class="sections-heading">

      <div>
        <p class="sections-title">разделы →</p>
        <p class="sections-description">
          свайпни влево и выбери нужный
        </p>
      </div>

    </div>

    <nav
      class="section-tabs"
      id="sectionTabs"
    >

      <button
        class="section-tab"
        type="button"
        data-section="supplements"
      >
        <span class="tab-icon">💊</span>
        <span>библиотека БАДов</span>
      </button>

      <button
        class="section-tab"
        type="button"
        data-section="medical"
      >
        <span class="tab-icon">✙</span>
        <span>молекулярная медицина</span>
      </button>

      <button
        class="section-tab"
        type="button"
        data-section="tools"
      >
        <span class="tab-icon">⌁</span>
        <span>калькуляторы</span>
      </button>

      <button
        class="section-tab"
        type="button"
        data-section="mood"
      >
        <span class="tab-icon">☼</span>
        <span>дневник настроения</span>
      </button>

      <button
        class="section-tab"
        type="button"
        data-section="rpp"
      >
        <span class="tab-icon">♡</span>
        <span>рпп</span>
      </button>

      <button
        class="section-tab"
        type="button"
        data-section="delicate"
      >
        <span class="tab-icon">۶ৎ</span>
        <span>delicate</span>
      </button>

      <button
        class="section-tab"
        type="button"
        data-section="care"
      >
        <span class="tab-icon">✿</span>
        <span>molecular care</span>
      </button>

      <button
        class="section-tab"
        type="button"
        data-section="links"
      >
        <span class="tab-icon">📎</span>
        <span>ссылки</span>
      </button>

    </nav>

  </div>

  <footer class="footer">
    вся информация внутри приложения несет ознакомительный характер
  </footer>

</section>

<section
  class="screen content-screen hidden"
  id="contentScreen"
>
  <div id="contentContainer"></div>
</section>

  </main>

  <script src="app.js"></script>

</body>
</html>
