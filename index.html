<!doctype html>
<html lang="ru">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#071426"
  >

  <title>molecule space</title>

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="style.css"
  >

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>


<body>

  <main class="app">

    <!-- главный экран -->

    <section
      id="homeScreen"
      class="screen home-screen"
    >

      <div class="hero">

        <div class="orb orb-one"></div>
        <div class="orb orb-two"></div>

        <p class="eyebrow">
          ✦ molecule space
        </p>

        <div class="quote-area">

          <p class="quote-label">
            фраза для поддержки
            твоего настроения
          </p>

          <p id="quote" class="quote">
            мы не обязаны заслуживать
            право на еду, отдых и заботу о себе
          </p>

          <button
            class="ghost-btn"
            id="newQuote"
          >
            ↻ другая фраза
          </button>

        </div>

      </div>


      <!-- нижняя навигация -->

      <nav class="section-tabs">

        <button
          class="section-tab"
          data-section="rpp"
        >
          <span>рпп</span>
        </button>

        <button
          class="section-tab"
          data-section="medical"
        >
          <span>медицина</span>
        </button>

        <button
          class="section-tab"
          data-section="supplements"
        >
          <span>бады</span>
        </button>

        <button
          class="section-tab"
          data-section="tools"
        >
          <span>инструменты</span>
        </button>

      </nav>

    </section>


    <!-- сюда javascript будет загружать остальные экраны -->

    <section
      id="contentScreen"
      class="screen content-screen hidden"
    >

      <div id="screenContent"></div>

    </section>


  </main>


  <script src="app.js"></script>

</body>

</html>
