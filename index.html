<!doctype html>

<html lang="ru">
<head>
  <meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0, viewport-fit=cover"

>

  <meta name="theme-color" content="#071426">

  <title>molecule adjutant</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="style.css">
  <style id="molecule-tracker-styles">

  .home-trackers {
  display:grid;
  gap:10px;
  margin-top:12px;
}

    
.tracker-card {
  width:100%; min-height:66px; 
  padding:13px 14px; display:flex;
  align-items:center; gap:11px;
  border:1px solid var(--line); 
  border-radius:20px;
  background:var(--card); 
  color:var(--text);
  text-align:left; cursor:pointer; box-shadow:0 12px 35px rgba(0,0,0,.08);
  backdrop-filter:blur(16px); 
  
  -webkit-backdrop-filter:blur(16px);
  
  transition:transform .2s ease,background .3s ease,border-color .3s ease;
}
.tracker-card:active { 
  transform:scale(.985);
}
.tracker-icon { 
  width:38px; height:38px; flex:0 0 38px; 
  display:grid; place-items:center;
  border-radius:13px; 
  background:var(--accent-soft); 
  font-size:19px; 
}
.tracker-card-content {
  min-width:0; flex:1;
  display:flex; flex-direction:column; 
  gap:3px; 
}
.tracker-card-content strong { 
  font-size:13px; font-weight:750;
}
.tracker-card-content small { 
  color:var(--muted); 
  font-size:10px; 
  line-height:1.35; 
  white-space:nowrap;
  overflow:hidden; 
  text-overflow:ellipsis;
}
.tracker-card-value {
  flex:0 0 auto; color:var(--text);
  font-size:11px;
  font-weight:750; 
}
.tracker-card-arrow {
  color:var(--muted); font-size:23px;
}

    
.water-mini-bar {
  width:56px;
  height:7px;
  
  flex:0 0 56px;
  border-radius:99px;
  
  background:var(--bg);
  overflow:hidden;
}
.water-mini-bar span { 
  display:block;
  height:100%; 
  width:0;
  border-radius:inherit; 
  background:
    linear-gradient(
      90deg,var(--blue),
      var(--purple),
      var(--pink)
    );
  transition:width .3s ease; 
}

    
.tracker-overlay {
  position:fixed;
  inset:0;
  z-index:2147483647; 
  overflow-y:auto; 
  padding:calc(18px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));
  background:color-mix(in srgb,var(--bg) 94%,transparent);
  color:var(--text); backdrop-filter:blur(18px); 
  
  -webkit-backdrop-filter:blur(18px);
}
.tracker-modal {
  width:min(680px,100%);
  min-height:100%;
  margin:0 auto; 
  padding:2px 0 30px; 
}
.tracker-close {
  width:38px; 
  height:38px;
  
  margin-bottom:18px;
  border:1px solid var(--line);
  border-radius:50%; 
  background:var(--card); 
  
  color:var(--text); 
  font-size:24px; cursor:pointer; 
}
.tracker-modal-kicker { 
  color:var(--muted); 
  font-size:10px;
  text-transform:uppercase; letter-spacing:.14em; 
}
.tracker-modal h2 { 
  margin:7px 0 20px;
  color:var(--text); 
  font-size:clamp(28px,8vw,38px); 
  line-height:1.05;
  letter-spacing:-.045em;
}
.tracker-modal-content { 
  display:flex;
  flex-direction:column; 
  gap:15px;
}

    
.streak-banner {
  padding:16px 17px; 
  border:1px solid var(--line); 
  border-radius:20px; 
  background:var(--card);
}
.streak-banner div {
  display:flex; 
  justify-content:space-between;
  align-items:baseline; gap:10px; 
}
.streak-banner span,
.streak-banner small { 
  color:var(--muted); 
  font-size:10px; 
}
.streak-banner strong { 
  font-size:19px;
}

    
.tracker-section-heading { 
  display:flex; 
  justify-content:space-between;
  align-items:center; 
  margin-top:5px; 
  color:var(--text); 
  font-size:12px; 
  font-weight:750; 
}
.tracker-section-heading small {
  color:var(--muted);
  font-weight:500; 
}

    
.supplement-list {
  display:flex; 
  flex-direction:column;
  gap:9px;
}
.supplement-row {
  padding:13px;
  border:1px solid var(--line);
  border-radius:18px; 
  background:var(--card);
}
.supplement-row-title {
  display:flex;
  justify-content:space-between;
  align-items:center; 
  gap:10px; 
  margin-bottom:10px; 
}
.supplement-row-title strong { 
  font-size:13px;
}
.mini-delete { 
  padding:5px 8px; 
  border-radius:9px; 
  background:rgba(255,80,120,.08);
  color:#c8788b; 
  font-size:9px; 
  cursor:pointer;
}
.supplement-days { 
  display:grid; 
  grid-template-columns:repeat(7,1fr); 
  gap:5px;
}
.supplement-day {
  min-width:0; 
  padding:7px 2px;
  border:1px solid transparent;
  border-radius:12px;
  background:rgba(127,127,127,.07);
  color:var(--muted);
  display:flex; 
  flex-direction:column;
  align-items:center;
  gap:2px;
  cursor:pointer;
}
.supplement-day span {
  font-size:8px; 
  text-transform:uppercase;
}
.supplement-day b { 
  color:var(--text);
  font-size:14px;
}
.supplement-day i {
  height:13px;
  color:var(--pink); 
  font-style:normal;
  font-size:11px; 
}
.supplement-day.is-done { 
  background:
    linear-gradient(
      145deg,
      rgba(255,159,207,.25),
      rgba(168,156,255,.16)); 
}
    
.supplement-day.is-today { 
  border-color:var(--pink);
}
.tracker-add-row { 
  display:grid;
  grid-template-columns:1fr auto; 
  gap:7px; 
}
.tracker-add-row input,
.reminder-form input,
.reminder-form select,
.water-goal-row input {
  width:100%;
  min-width:0; 
  padding:11px 12px;
  border:1px solid var(--line);
  border-radius:13px;
  outline:none; 
  
  background:rgba(127,127,127,.07);
  color:var(--text); 
  
  font:inherit;
  font-size:12px;
}
.tracker-add-row button,
.water-buttons button,
.reminder-item-actions button {
  border-radius:12px;
  
  background:rgba(127,127,127,.09); 
  color:var(--text);
  
  padding:10px 11px; 
  font-size:11px;
  
  cursor:pointer;
}
.tracker-hint {
  color:var(--muted);
  font-size:10px;
  line-height:1.55;
}
.empty-tracker-state {
  padding:30px 18px; 
  border:1px dashed var(--line);
  border-radius:20px;
  text-align:center; 
  background:var(--card);
}
.empty-tracker-state span { 
  display:block;
  font-size:28px;
  margin-bottom:8px;
}
.empty-tracker-state strong {
  display:block;
  font-size:13px;
}
.empty-tracker-state p {
  margin:6px 0 0;
  color:var(--muted);
  font-size:10px;
  line-height:1.5;
}
.empty-tracker-state.compact {
  padding:22px 16px; 
}

.water-big-card { 
  display:flex; 
  align-items:center;
  justify-content:center; 
  gap:22px; 
  padding:18px;
  border:1px solid var(--line); 
  border-radius:24px; 
  background:var(--card);
}
.water-orb {
  width:112px;
  height:112px; 
  flex:0 0 112px;
  border-radius:50%; 
  display:grid;
  place-items:center;
  background:
    radial-gradient(
  circle,
  var(--card) 61%,transparent 62%),
  conic-gradient(
  var(--blue) 0 var(--water-progress),
  rgba(127,127,127,.10)var(--water-progress) 100%);
}
.water-orb span { 
  font-size:20px;
  font-weight:800; 
}
.water-big-card div:last-child {
  display:flex;
  flex-direction:column; 
  gap:4px;
}
.water-big-card strong {
  font-size:27px;
}
.water-big-card small { 
  color:var(--muted); 
  font-size:10px;
}
.water-progress-track { 
  height:10px;
  border-radius:99px; 
  overflow:hidden;
  background:rgba(127,127,127,.1);
}
.water-progress-track span { 
  display:block;
  height:100%; 
  border-radius:inherit;
  background:
    linear-gradient(
  90deg,
  var(--blue),
  var(--purple),
  var(--pink));
}
.water-buttons {
  display:grid; 
  grid-template-columns:repeat(3,1fr);
  gap:7px; 
}
.water-buttons button {
  padding:11px 5px; 
}
.water-goal-row { 
  display:flex;
  align-items:center; 
  justify-content:space-between; 
  gap:12px; 
  padding:13px 0; 
  border-top:1px solid var(--line);
  border-bottom:1px solid var(--line); 
  color:var(--muted); 
  font-size:11px; 
}
.water-goal-row div { 
  display:flex; 
  align-items:center; 
  gap:7px;
}
.water-goal-row input {
  width:105px;
}

.reminder-form { 
  padding:15px; 
  border:1px solid var(--line);
  border-radius:20px; 
  background:var(--card);
}
.reminder-form-grid {
  display:grid;
  grid-template-columns:1fr 1fr; 
  gap:8px; 
  margin-top:8px;
}
.reminder-form label {
  display:grid; 
  gap:5px; 
  color:var(--muted);
  font-size:10px;
}
    
.primary-tracker-button {
  width:100%;
  margin-top:10px; 
  padding:12px 14px; 
  border-radius:14px; 
  background:
    linear-gradient(
  135deg,
  var(--purple),
  var(--pink)); 
  color:#fff; 
  font-weight:750; 
  font-size:12px; 
  cursor:pointer; 
}

  .reminder-list { 
  display:flex;
  flex-direction:column;
  gap:8px;
}
.reminder-item { 
  display:flex;
  justify-content:space-between;
  align-items:center; 
  gap:12px; 
  padding:13px; 
  border:1px solid var(--line); 
  border-radius:17px;
  background:var(--card);
}
.reminder-item > div:first-child {
  min-width:0;
  display:flex; 
  flex-direction:column; 
  gap:3px;
}
.reminder-item strong {
  font-size:12px; 
  overflow:hidden; 
  text-overflow:ellipsis; 
  white-space:nowrap;
}
.reminder-item small {
  color:var(--muted);
  font-size:9px; 
}
.reminder-item-actions {
  display:flex;                       
  gap:5px;                      
  flex:0 0 auto;                        
}
.reminder-item-actions button:last-child {
  width:31px; 
  padding:6px; 
  color: #c8788b; 
}

    
.theme-grid {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
}
    
.theme-option {
  min-height:105px;
  padding:13px; 
  border:1px solid var(--line); 
  border-radius:19px;
  display:grid; 
  grid-template-columns:35px 1fr; grid-template-rows:1fr 1fr; 
  align-items:center;
  text-align:left;
  color:var(--text);
  cursor:pointer;
}
.theme-option span { 
  grid-row:1/3; 
  font-size:24px; 
  text-align:center;
}
.theme-option strong { 
  font-size:12px;
}
.theme-option small { 
  color:var(--muted);
  font-size:9px;
}
.theme-option.is-active {
  border-color:var(--pink); 
  box-shadow:0 0 0 1px var(--pink) inset;
}
    
.theme-preview-dark { 
  background:linear-gradient(145deg,#071426,#172f4e);
  color:#f2f7ff;
}
.theme-preview-pink { 
  background:linear-gradient(145deg,#3d2034,#6a3659); 
  color:#fff4fa;
}
.theme-preview-angel { 
  background:linear-gradient(145deg,#fff,#eee7ff);
  color:#443b56; 
}
.theme-preview-minimalism { 
  background:linear-gradient(145deg,#fff,#e8e8e2);
  color:#242421;
}

.tracker-toast {
  position:fixed;
  left:16px; right:16px;
  bottom:calc(18px + env(safe-area-inset-bottom)); 
  z-index:2147483648;
  display:flex;
  align-items:center;
  gap:10px; 
  padding:13px 15px; 
  border:1px solid var(--line); 
  border-radius:17px;
  background:var(--card-light); 
  color:var(--text);
  box-shadow:0 18px 45px rgba(0,0,0,.2);
  backdrop-filter:blur(20px); 
  
  animation:trackerToastIn .25s ease both;
}
.tracker-toast > span { 
  font-size:20px;
}
.tracker-toast div {
  display:flex;
  flex-direction:column;
  gap:2px;
}
.tracker-toast strong {
  font-size:12px; 
}
.tracker-toast small {
  color:var(--muted);
  font-size:10px;
}

    @keyframes trackerToastIn { 
  from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} 
}

    
@media (min-width:650px) {
  .home-trackers { 
    grid-template-columns:1fr 1fr; 
  }
  .reminder-tracker-card { 
    grid-column:1/-1; 
  }
}
    
@media (max-width:380px) {
  .water-big-card { 
    gap:12px;
  } .water-orb { 
    width:94px;
    height:94px;
    flex-basis:94px; 
  } 
  .water-big-card strong {
    font-size:22px; 
  }
}
    </style>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>


</head>

<body>

  <main class="app">

<section class="screen home-screen" id="homeScreen">

  <div class="home-glow glow-one"></div>
  <div class="home-glow glow-two"></div>

  <div class="home-content">

    <div class="home-topbar">

      <div class="brand">
        <span class="brand-star" style="font-size: 55px;">⚛︎</span>
        <span style="font-size: 15px;">molecule adjutant</span>
        <p class="sections-title"><i>by arttmolecule</i></p>
      </div>

      <button
        class="theme-toggle"
        type="button"
        data-section="links"
      >
        <span class="theme-toggle-icon" >📎</span>
      </button>
      <button
        class="theme-toggle"
        id="themeToggle"
        type="button"
        aria-label="Переключить тему"
      >
        <span class="theme-toggle-icon" id="themeToggleIcon">☾</span>
      </button>
    </div>

    
    <button
      class="diary-quick-card"
      id="quickDiaryButton"
      type="button"
    >
      <span class="diary-quick-icon">✎</span>

      <span class="diary-quick-content">
        <strong>добавить запись в дневник</strong>
        <small>напиши о том какое у тебя сегодня настроение</small>
      </span>

      <span class="diary-quick-arrow">›</span>
    </button>
    
    <div>
 <p class="quote-text" id="quote">
       срыв — не повод бросать все
      </p>

      
      <button
        class="quote-button"
        id="newQuote"
        type="button"
      >
        еще мотивации
      </button>

    </div>


    <div class="home-trackers">
      <button class="tracker-card supplements-tracker-card" id="supplementsTrackerButton" type="button">
        <span class="tracker-icon">💊</span>
        <span class="tracker-card-content">
          <strong>трекер приема</strong>
          <small id="supplementsTrackerSummary">отметь прием в каледаре, чтобы не пропустить серию</small>
        </span>
        <span class="tracker-card-value" id="supplementsStreak">0 🔥</span>
      </button>

      <button class="tracker-card water-tracker-card" id="waterTrackerButton" type="button">
        <span class="tracker-icon">💧</span>
        <span class="tracker-card-content">
          <strong>выпито воды</strong>
          <small id="waterTrackerSummary">0 мл из 2000 мл</small>
        </span>
        <span class="water-mini-bar"><span id="waterMiniProgress"></span></span>
      </button>


      
  </div>
    <div>


      
  </div>
  <div class="sections-area">

    <div class="sections-heading">

      <div>
        <p class="sections-title">разделы →</p>
        <p class="sections-description">
          свайпни влево и выбери нужный
        </p>
      </div>

    </div>

    <nav
      class="section-tabs"
      id="sectionTabs"
    >

      <button
        class="section-tab"
        type="button"
        data-section="supplements"
      >
        <span class="tab-icon">💊</span>
        <span>библиотека БАДов</span>
      </button>

      <button
        class="section-tab"
        type="button"
        data-section="medical"
      >
        <span class="tab-icon">✙</span>
        <span>молекулярная медицина</span>
      </button>

      <button
        class="section-tab"
        type="button"
        data-section="tools"
      >
        <span class="tab-icon">⌁</span>
        <span>калькуляторы</span>
      </button>

      <button
        class="section-tab"
        type="button"
        data-section="mood"
      >
        <span class="tab-icon">☼</span>
        <span>дневник настроения</span>
      </button>

      <button
        class="section-tab"
        type="button"
        data-section="rpp"
      >
        <span class="tab-icon">♡</span>
        <span>рпп</span>
      </button>

      <button
        class="section-tab"
        type="button"
        data-section="delicate"
      >
        <span class="tab-icon">۶ৎ</span>
        <span>delicate</span>
      </button>

      <button
        class="section-tab"
        type="button"
        data-section="care"
      >
        <span class="tab-icon">✿</span>
        <span>molecular care</span>
      </button>

    </nav>

  </div>

  <footer class="footer">
    вся информация внутри приложения несет ознакомительный характер
  </footer>

</section>

<section
  class="screen content-screen hidden"
  id="contentScreen"
>
  <div id="contentContainer"></div>
</section>

  </main>

  <script src="app.js"></script>

</body>
</html>
