<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta name="theme-color" content="#071426">

  <title>molecule space</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="style.css">

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>

<body>

  <main class="app">

    <!-- =========================
         ГЛАВНЫЙ ЭКРАН
    ========================== -->

    <section class="screen home-screen" id="homeScreen">

      <div class="home-glow glow-one"></div>
      <div class="home-glow glow-two"></div>

      <div class="home-content">

        <div class="brand">
          <span class="brand-star">✦</span>
          <span>molecule space</span>
       <footer class="footer"><em>by arttmolecule</em>
      </footer>
        </div>
          
          <div class="quote-card">
            <h4 class="support-subtitle">
            фраза для поддержки
          </h4>
          <h5 class="support-subtitle">
            твоего настроения
          </h5>

            <p class="quote-text" id="quote">
              мы не обязаны заслуживать право на еду, отдых и заботу о себе
            </p>
            <button class="quote-button" id="newQuote">
              другая фраза 
            </button>
          </div>

        </div>

      </div>

 </div>
      
      <!-- =========================
           РАЗДЕЛЫ
      ========================== -->

      <div class="sections-area">

        <div class="sections-heading">
          <div>
            <p class="sections-title">разделы</p>
            <p class="sections-description">свайпни влево и выбери нужный</p>
          </div>

          <span class="swipe-hint">→</span>
        </div>


        <nav class="section-tabs" id="sectionTabs">

          <button class="section-tab" data-section="rpp">
            <span class="tab-icon">♡</span>
            <span>РПП</span>
          </button>

          <button class="section-tab" data-section="medical">
            <span class="tab-icon">＋</span>
            <span>молекулярная медицина</span>
          </button>

          <button class="section-tab" data-section="supplements">
            <span class="tab-icon">✦</span>
            <span>библиотека БАДов</span>
          </button>

          
          <button class="section-tab" data-section="links">
            <span class="tab-icon">📎</span>
            <span>ссылки</span>
          </button>

          <button class="section-tab" data-section="delicate">
            <span class="tab-icon">۶ৎ</span>
            <span>delicate</span>
          </button>

          <button class="section-tab" data-section="beauty">
            <span class="tab-icon">✿</span>
            <span>molecular beauty</span>
          </button>
          
          <button class="section-tab" data-section="tools">
            <span class="tab-icon">⌁</span>
            <span>калькуляторы</span>
          </button>

        </nav>

      </div>


      <footer class="footer">
       вся информация внутри приложения несет ознакомительный характер
      </footer>

    </section>


    <!-- =========================
         ЭКРАН РАЗДЕЛА / СТАТЬИ
    ========================== -->

    <section
      class="screen content-screen hidden"
      id="contentScreen"
    >

      <div id="contentContainer"></div>

    </section>

  </main>


  <script src="app.js"></script>

</body>
</html>
